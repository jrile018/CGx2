[package]
name = "cgx2-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "cgx2_cli"
path = "src/lib.rs"
[features]
failure-injection-test = ["cgx2-runtime/fault-injection"]

[[bin]]
name = "cgx2"
path = "src/main.rs"

[dependencies]
cgx2-syntax = { path = "../cgx2-syntax" }
cgx2-sema = { path = "../cgx2-sema" }
cgx2-runtime = { path = "../cgx2-runtime" }
cgx2-foreign = { path = "../cgx2-foreign" }
cgx2-package = { path = "../cgx2-package" }
cgx2-bind = { path = "../cgx2-bind" }
cgx2-ffi-native = { path = "../cgx2-ffi-native" }
cgx2-libtorch = { path = "../cgx2-libtorch" }
serde_json = "=1.0.149"

[dev-dependencies]
sha2 = "=0.10.9"
