[package]
name = "cgx2-python-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[features]
default = []
in-process = ["dep:pyo3"]

[[example]]
name = "numeric_array_bench"
required-features = ["in-process"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["auto-initialize"], optional = true }
