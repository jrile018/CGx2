<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="cgx2-token" content="__TOKEN__"><title>CGx2 notebook preview</title>
<link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main><header><div><h1>CGx2 notebook</h1><p>Local pure-scalar preview · Markdown is read-only</p></div>
<div class="controls"><button id="next">Run next</button><button id="restart">Restart and run all</button></div></header>
<p id="notice" role="status"></p><section id="cells" aria-label="Notebook cells"></section>
<footer><label>Save as <input id="save-name" autocomplete="off" spellcheck="false" aria-label="Save filename"></label>
<label><input type="checkbox" id="overwrite"> Overwrite existing file</label><button id="save">Save as</button>
<p>Save writes beside the opened notebook. The opened file changes only when you name it and check Overwrite.</p></footer></main></body></html>
